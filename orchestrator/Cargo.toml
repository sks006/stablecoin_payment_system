[package]
name = "orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.32", features = ["full"] }
axum = { version = "0.6", features = ["headers"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7.3", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "macros"] }
redis = { version = "0.23", features = ["tokio-comp"] }
solana-client = "1.18.26"
solana-sdk = "1.18.26"
solana-transaction-status = "1.18.26"
solana-zk-token-sdk = "=1.18.26"
spl-token = { version = "4.0.0", features = ["no-entrypoint"] }
rdkafka = { version = "0.36" }
aws-config = "0.56"
aws-sdk-kms = "0.29"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = "0.13"
lazy_static = "1.4"
config = "0.13"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.4", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
reqwest = { version = "0.11", features = ["json"] }
hmac = "0.12"
sha2 = "0.10"
shared_memory = { path = "../onchain/programs/shared_memory" }

[[test]]
name = "webhook_test"
path = "tests/integration/webhook_test.rs"

[[test]]
name = "mint_api_test"
path = "tests/integration/mint_api_test.rs"

[[test]]
name = "idempotency_test"
path = "tests/integration/idempotency_test.rs"

[patch.crates-io]
curve25519-dalek = { git = "https://github.com/solana-labs/curve25519-dalek.git", rev = "c14774464c4d38de553c6ef2f48a10982c1b4801" }
aes-gcm-siv = { git = "https://github.com/RustCrypto/AEADs", rev = "6105d7a5591aefa646a95d12b5e8d3f55a9214ef" }

[workspace]
resolver = "2"
